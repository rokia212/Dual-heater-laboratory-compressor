<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You | Dual Heater Laboratory Compressor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:radial-gradient(circle at top, #1f6b55, #0F3D2E);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  overflow:hidden;
}

/* ===== BACKGROUND GLOW CIRCLES ===== */
.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(76,175,147,0.15);
  animation: float 8s infinite ease-in-out;
}

.circle.one{
  width:280px;
  height:280px;
  top:10%;
  left:15%;
}

.circle.two{
  width:180px;
  height:180px;
  bottom:20%;
  right:20%;
  animation-delay:2s;
}

.circle.three{
  width:120px;
  height:120px;
  top:60%;
  left:60%;
  animation-delay:4s;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-25px);}
  100%{transform:translateY(0);}
}

/* ===== CONTENT ===== */
.card{
  position:relative;
  z-index:10;
  background:rgba(0,0,0,0.45);
  backdrop-filter: blur(10px);
  padding:70px 90px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,0.4);
}

.card h1{
  font-size:56px;
  margin-bottom:15px;
}

.card h2{
  font-size:22px;
  color:#9FE3C9;
  margin-bottom:30px;
}

.card p{
  font-size:15px;
  line-height:1.7;
  opacity:0.9;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:40px;
  padding:14px 36px;
  border-radius:40px;
  border:2px solid #9FE3C9;
  background:transparent;
  color:#9FE3C9;
  font-size:14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.3s;
}

.btn::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:0%;
  height:100%;
  background:#9FE3C9;
  z-index:-1;
  transition:.4s;
}

.btn:hover::before{
  width:100%;
}

.btn:hover{
  color:#0F3D2E;
}
</style>
</head>

<body>

<!-- BACKGROUND ELEMENTS -->
<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<!-- THANK YOU CARD -->
<div class="card">
  <h1>Thank You!🥳</h1>
  <h2>Dual Heater Laboratory Compressor</h2>
  <p>
    Your contribution helps us turn electronic waste into
    sustainable laboratory equipment.
    <br><br>
    We will contact you soon to complete the donation process.
  </p>

  <button class="btn" onclick="goHome()">Back to Home</button>
</div>

<script>
function goHome(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
